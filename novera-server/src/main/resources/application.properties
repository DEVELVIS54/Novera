spring.application.name=novera-server

# --- Base PostgreSQL (valeurs surchargeables par variables d'environnement) ---
spring.datasource.url=${NOVERA_DB_URL:jdbc:postgresql://localhost:5432/novera}
spring.datasource.username=${NOVERA_DB_USER:novera}
spring.datasource.password=${NOVERA_DB_PASSWORD:novera}
spring.sql.init.mode=always

# --- Sécurité : OBLIGATOIRES, aucune valeur par défaut volontairement ---
# Clé partagée avec le desktop (écran Synchronisation) et secret de signature des sessions parents.
novera.api-key=${NOVERA_API_KEY}
novera.token-secret=${NOVERA_TOKEN_SECRET}

server.port=${PORT:8080}
spring.jackson.deserialization.fail-on-unknown-properties=false
